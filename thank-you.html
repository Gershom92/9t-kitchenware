<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You for Your Order!</title>
  
  <!-- Styling -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background-color: #e6f4ea;
      color: #1e8e3e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px auto;
    }
    h1 {
      color: #202124;
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #5f6368;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .details-box {
      background: #f8f9fa;
      border: 1px dashed #dadce0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #3c4043;
    }
    .btn {
      display: inline-block;
      background-color: #1a73e8;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #1557b0;
    }
  </style>

  <!-- PASTE YOUR GOOGLE ADS TRACKING TAG DIRECTLY BELOW THIS LINE -->
  
  <!-- END OF GOOGLE ADS TAG -->
</head>
<body>

  <div class="card">
    <div class="icon">✓</div>
    <h1>Thank You for Your Order!</h1>
    <p>We’ve successfully received your purchase. Our team is preparing your shipment, and we’ll contact you shortly with further details.</p>
    
    <div class="details-box">
      If you have any questions about your order, please reach out to our customer support.
    </div>

    <a href="index.html" class="btn">Return to Storefront</a>
  </div>

</body>
</html>
