<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9t Quality Kitchenware | Kampala</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f8;
    }

    /* Top Bar & Header */
    .top-bar {
      background-color: #1a1a1a;
      color: #ffffff;
      text-align: center;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    header {
      background-color: #ffffff;
      padding: 10px 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
    }

    .brand h1 {
      color: #d32f2f;
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .brand p {
      font-size: 0.75rem;
      color: #666666;
    }

    .contact-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-contact {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-wa {
      background-color: #25D366;
      color: #ffffff;
    }

    .btn-call {
      background-color: #1a1a1a;
      color: #ffffff;
    }

    /* Embedded Take App iFrame */
    .store-container {
      width: 100%;
      height: calc(100vh - 85px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    🚚 Fast Delivery Across Kampala & Central Uganda | Pay on Delivery
  </div>

  <header>
    <div class="brand">
      <h1>9t Kitchenware</h1>
      <p>Quality Home Appliances</p>
    </div>
    <div class="contact-buttons">
      <a href="https://wa.me/256784891092" class="btn-contact btn-wa" target="_blank">💬 WhatsApp</a>
      <a href="tel:0740701068" class="btn-contact btn-call">📞 Call</a>
    </div>
  </header>

  <div class="store-container">
    <iframe src="https://take.app/gershommuwanguzi92" title="9t Quality Kitchenware Catalog"></iframe>
  </div>

</body>
</html>
